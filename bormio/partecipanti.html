<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Who's Who? · Bormio</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/partecipanti-game.css" rel="stylesheet">
</head>
<body data-root="..">
    <div class="lang">
        <button data-lang="it" onclick="setLanguage('it')">IT</button>
        <button data-lang="es" onclick="setLanguage('es')">ES</button>
    </div>
    <section class="who-page">
        <header class="top"><a class="back" href="index.html" aria-label="Back">←</a></header>
        <main class="who-main">
            <div class="who-head">
                <div class="smallcap" data-i18n="game.kicker"></div>
                <h1 data-i18n="game.title"></h1>
                <p data-i18n="game.subtitle"></p>
            </div>
            <section id="gridView">
                <div class="game-status">
                    <div><span id="playedCount">0 / 6</span><small id="playedLabel"></small></div>
                    <div><span id="score">0 / 6</span><small id="pointsLabel"></small></div>
                </div>
                <p class="grid-instruction" id="gridInstruction"></p>
                <div class="people-grid" id="peopleGrid"></div>
            </section>
            <section id="quizView" class="hidden"></section>
        </main>
    </section>
    <script src="../js/i18n.js"></script>
    <script src="../js/partecipanti-game.js"></script>
</body>
</html>
