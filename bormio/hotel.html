<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body data-root="..">
  <div class="lang">
   <button data-lang="it" onclick="setLanguage('it')">
    IT
   </button>
   <button data-lang="es" onclick="setLanguage('es')">
    ES
   </button>
  </div>
  <section class="hotel">
   <header class="top">
    <a class="back" href="index.html">
     &larr;
    </a>
   </header>
   <main class="hotelmain">
    <div class="hotelhero">
     <div class="smallcap">
      BORMIO &middot; 02&mdash;05 FEBBRAIO 2027
     </div>
     <h2 data-i18n="hotel.title">
     </h2>
    </div>
    <section class="panel">
     <div class="smallcap" data-i18n="hotel.ours">
     </div>
     <h3>
      🏨 QC HOUSE
     </h3>
     <p class="muted">
      Via Freita, 7 &middot; Santa Caterina Valfurva (SO)
     </p>
     <img class="hotelphoto" src="../images/qc-house-interior.jpeg"/>
     <div class="stay">
      <div>
       <small data-i18n="hotel.checkin">
       </small>
       <b>
        2 FEBBRAIO 2027
       </b>
       <span>
        15:00
       </span>
      </div>
      <div>
       <small data-i18n="hotel.checkout">
       </small>
       <b>
        5 FEBBRAIO 2027
       </b>
       <span>
        10:00
       </span>
      </div>
     </div>
     <div class="smallcap" data-i18n="hotel.position">
     </div>
     <div class="map">
      <iframe src="https://www.google.com/maps?q=Via%20Freita%207%20Santa%20Caterina%20Valfurva%20SO&amp;output=embed">
      </iframe>
     </div>
     <a class="action" data-i18n="hotel.maps" href="https://www.google.com/maps/search/?api=1&amp;query=Via%20Freita%207%2C%20Santa%20Caterina%20Valfurva%20SO" target="_blank">
     </a>
    </section>
    <section class="panel">
     <div class="smallcap" data-i18n="hotel.arrive">
     </div>
     <h3 data-i18n="hotel.choose">
     </h3>
     <div class="airports">
      <button class="airport active" data-origin="Orio al Serio International Airport">
       <b>
        Orio al Serio
       </b>
       <small>
        BGY
       </small>
      </button>
      <button class="airport" data-origin="Milan Malpensa Airport">
       <b>
        Milano Malpensa
       </b>
       <small>
        MXP
       </small>
      </button>
      <button class="airport" data-origin="Venice Marco Polo Airport">
       <b>
        Venezia Marco Polo
       </b>
       <small>
        VCE
       </small>
      </button>
      
      
     </div>
     <div class="route">
      <span id="routeOrigin">
       Orio al Serio
      </span>
      &rarr; QC House
     </div>
     <div class="map">
      <iframe id="routeMap">
      </iframe>
     </div>
     <a class="action" data-i18n="hotel.route" id="routeLink" target="_blank">
     </a>
    </section>
   </main>
  </section>
  <script src="../js/i18n.js">
  </script>
  <script src="../js/hotel.js">
  </script>
 </body>
</html>
