<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ristoranti · Bormio</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/ristoranti.css" rel="stylesheet">
</head>

<body data-root="..">
    <div class="lang">
        <button data-lang="it" onclick="setLanguage('it')">IT</button>
        <button data-lang="es" onclick="setLanguage('es')">ES</button>
    </div>

    <section class="restaurants-page">
        <header class="top">
            <a class="back" href="index.html">←</a>
        </header>

        <main class="restaurants-main">
            <section class="restaurants-hero">
                <div class="smallcap">BORMIO · FOOD & DRINK</div>
                <h1 data-i18n="restaurants.title"></h1>
                <p data-i18n="restaurants.subtitle"></p>
            </section>

            <section>
                <div class="restaurants-section-title">
                    <span>🍽️</span>
                    <div>
                        <h2 data-i18n="restaurants.dinnersTitle"></h2>
                        <p data-i18n="restaurants.dinnersSubtitle"></p>
                    </div>
                </div>
                <div id="dinnerRestaurants" class="restaurant-grid"></div>
            </section>

            <section class="lunch-section">
                <div class="restaurants-section-title">
                    <span>🍕</span>
                    <div>
                        <h2 data-i18n="restaurants.lunchTitle"></h2>
                        <p data-i18n="restaurants.lunchSubtitle"></p>
                    </div>
                </div>
                <div id="lunchRestaurants" class="restaurant-grid lunch-grid"></div>
            </section>
        </main>
    </section>

    <script src="../js/i18n.js"></script>
    <script src="../js/ristoranti.js"></script>
</body>
</html>
